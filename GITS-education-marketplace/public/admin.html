<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GITS Admin</title><link rel="stylesheet" href="style.css"></head><body><header><b>GITS ADMIN</b><a href="/">Customer Site</a></header><main><section class="card"><h1>Add Education Document</h1><form id="f"><input id="name" placeholder="Document name" required><textarea id="description" placeholder="Description"></textarea><input id="price" type="number" placeholder="Price" required><input id="fileUrl" placeholder="Secure download URL (optional)"><button>Add Document</button></form><p id="m"></p></section><h2>Documents</h2><div id="list"></div></main><script>
async function load(){let ps=await fetch("/api/admin/products").then(r=>r.json());list.innerHTML=ps.map(p=>`<div class="card"><h3>${p.name}</h3><p>${p.description||""}</p><strong>KSh ${p.price}</strong></div>`).join("")}f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,description:description.value,price:price.value,fileUrl:fileUrl.value})});m.textContent=r.ok?"Document added successfully":"Could not add document";e.target.reset();load()};load();
</script></body></html>
