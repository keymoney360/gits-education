<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | GITS</title><link rel="stylesheet" href="style.css"></head><body><main class="form"><h1>Login</h1><form id="f"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><p id="m"></p><a href="/register.html">Create account</a></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})});let x=await r.json();if(x.id){localStorage.gitsUser=x.id;location="/dashboard.html"}else m.textContent=x.error}</script></body></html>
