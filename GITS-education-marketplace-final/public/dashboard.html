<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | GITS</title><link rel="stylesheet" href="style.css"></head>
<body><header><b>GITS DASHBOARD</b><a href="/">Home</a></header><main><div id="welcome"></div><div class="grid">
<div class="card"><h3>Available Balance</h3><strong id="balance"></strong></div><div class="card"><h3>Total Earned</h3><strong id="earned"></strong></div><div class="card"><h3>People Referred</h3><strong id="referrals"></strong></div></div>
<section class="card"><h2>Your Referral Link</h2><input id="referralLink" readonly><p>Share this link with people who may want to purchase GITS educational resources.</p></section>
<section class="card"><h2>Purchases</h2><div id="purchases"></div></section></main>
<script>
const id=localStorage.getItem("gitsUser");const welcome=document.getElementById("welcome"),balance=document.getElementById("balance"),earned=document.getElementById("earned"),referrals=document.getElementById("referrals"),referralLink=document.getElementById("referralLink"),purchases=document.getElementById("purchases");
if(!id){location="/login.html"}else{fetch("/api/dashboard/"+encodeURIComponent(id),{cache:"no-store"}).then(async r=>{const x=await r.json();if(!r.ok)throw new Error(x.error||"Unable to load dashboard");welcome.innerHTML="<h1>Welcome, "+x.user.name+"</h1><p>"+x.user.email+"</p>";balance.textContent="KSh "+x.user.balance;earned.textContent="KSh "+x.user.totalEarned;referrals.textContent=x.referrals;referralLink.value=location.origin+"/register.html?ref="+x.user.refCode;purchases.innerHTML=x.purchases.length?x.purchases.map(v=>"<p>"+(v.productId?.name||"Document")+" — KSh "+v.amount+"</p>").join(""):"No purchases yet."}).catch(e=>{welcome.innerHTML="<p>"+e.message+"</p>"})}
</script></body></html>
