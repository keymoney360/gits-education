<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GITS Admin</title><link rel="stylesheet" href="style.css"></head>
<body><header><b>GITS ADMIN</b><a href="/">Customer Site</a></header><main><section class="card"><h1>Add Education Document</h1>
<form id="adminForm"><input id="productName" placeholder="Document name" required><textarea id="description" placeholder="Description"></textarea><input id="price" type="number" min="0" placeholder="Price" required><input id="fileUrl" placeholder="Secure download URL (optional)"><button type="submit">Add Document</button></form><p id="message"></p></section>
<h2>Documents</h2><div id="list"><p>Loading documents...</p></div></main>
<script>
const form=document.getElementById("adminForm"),nameEl=document.getElementById("productName"),descEl=document.getElementById("description"),priceEl=document.getElementById("price"),urlEl=document.getElementById("fileUrl"),message=document.getElementById("message"),list=document.getElementById("list");
async function load(){try{const r=await fetch("/api/admin/products",{cache:"no-store"});const ps=await r.json();if(!r.ok)throw new Error(ps.error||"Could not load documents");list.innerHTML=ps.length?ps.map(p=>`<div class="card"><h3>${p.name}</h3><p>${p.description||""}</p><strong>KSh ${Number(p.price||0).toLocaleString()}</strong></div>`).join(""):"<p>No documents yet.</p>"}catch(e){list.innerHTML="<p>"+e.message+"</p>"}}
form.addEventListener("submit",async e=>{e.preventDefault();message.textContent="Adding document...";try{const r=await fetch("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:nameEl.value.trim(),description:descEl.value.trim(),price:priceEl.value,fileUrl:urlEl.value.trim()})});const x=await r.json();if(!r.ok)throw new Error(x.error||"Could not add document");message.textContent="Document added successfully.";form.reset();await load()}catch(e){message.textContent=e.message}});
load();
</script></body></html>
