<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join GITS</title><link rel="stylesheet" href="style.css"></head><body><main class="form"><h1>Create GITS Account</h1><form id="f"><input id="name" placeholder="Full name" required><input id="email" type="email" placeholder="Email" required><input id="phone" placeholder="Phone number"><input id="password" type="password" placeholder="Password" required><input id="refCode" placeholder="Referral code (optional)"><button>Create Account</button></form><p id="m"></p><a href="/login.html">Already have an account?</a></main><script>
const q=new URLSearchParams(location.search);refCode.value=q.get("ref")||"";
f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,email:email.value,phone:phone.value,password:password.value,refCode:refCode.value})});let x=await r.json();m.textContent=x.error||"Account created. Your referral code is "+x.refCode; if(x.id)localStorage.gitsUser=x.id;if(x.id)setTimeout(()=>location="/dashboard.html",700)};
</script></body></html>
