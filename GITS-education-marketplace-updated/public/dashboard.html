<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | GITS</title><link rel="stylesheet" href="style.css"></head><body><header><b>GITS DASHBOARD</b><a href="/">Home</a></header><main><div id="d"></div><div class="grid"><div class="card"><h3>Available Balance</h3><strong id="bal"></strong></div><div class="card"><h3>Total Earned</h3><strong id="earn"></strong></div><div class="card"><h3>People Referred</h3><strong id="refs"></strong></div></div><section class="card"><h2>Your Referral Link</h2><input id="link" readonly><p>Share this link with people who may want to purchase GITS educational resources.</p></section><section class="card"><h2>Purchases</h2><div id="p"></div></section></main><script>
let id=localStorage.gitsUser;if(!id)location="/login.html";fetch("/api/dashboard/"+id).then(r=>r.json()).then(x=>{d.innerHTML="<h1>Welcome, "+x.user.name+"</h1><p>"+x.user.email+"</p>";bal.textContent="KSh "+x.user.balance;earn.textContent="KSh "+x.user.totalEarned;refs.textContent=x.referrals;link.value=location.origin+"/register.html?ref="+x.user.refCode;p.innerHTML=x.purchases.length?x.purchases.map(v=>"<p>"+v.productId.name+" — KSh "+v.amount+"</p>").join(""):"No purchases yet."});
</script></body></html>
